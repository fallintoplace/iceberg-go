name: Compare compaction partition planning

on:
  push:
    branches:
      - perf/compaction-bench-run-20261021

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
      - name: Compare same benchmarks on base and proposed code
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          cp table/compaction/compaction_partition_reuse_bench_test.go "$RUNNER_TEMP/partition_bench_test.go"

          git checkout --detach 9dd8d308f6fa2119eccb4b7393b7dfc153a19b45
          cp "$RUNNER_TEMP/partition_bench_test.go" table/compaction/compaction_partition_reuse_bench_test.go
          go test ./table/compaction -run '^$' -bench '^BenchmarkPlanCompactionPartitionBuckets$' -benchmem -benchtime=200ms -count=3 > "$RUNNER_TEMP/baseline.txt"
          rm table/compaction/compaction_partition_reuse_bench_test.go

          git checkout --detach "$head_sha"
          unformatted="$(gofmt -l table/compaction/compaction.go table/compaction/partition_bucket_cache.go table/compaction/partition_bucket_cache_test.go table/compaction/compaction_partition_reuse_test.go table/compaction/compaction_partition_reuse_bench_test.go)"
          if [[ -n "$unformatted" ]]; then
            echo "Unformatted files: $unformatted"
            exit 1
          fi
          go test ./table/compaction -run 'Test(SameCompactionPartition|PlanCompactionKeepsFirstSeenPartitionOrder)$' -count=1
          go test ./table/compaction -run '^$' -bench '^BenchmarkPlanCompactionPartitionBuckets$' -benchmem -benchtime=200ms -count=3 > "$RUNNER_TEMP/optimized.txt"

          echo "===== BASELINE ====="
          cat "$RUNNER_TEMP/baseline.txt"
          echo "===== OPTIMIZED ====="
          cat "$RUNNER_TEMP/optimized.txt"
