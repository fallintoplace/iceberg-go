# Temporary base-vs-head benchmark workflow, removed from final PR.
name: DV range benchmark

on:
  push:
    branches:
      - perf/dv-dense-range-masks-20261021

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: apache/iceberg-go
          ref: 407a4cdc8fd73352364d2ebf0af0f597f24ff9d5
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: head
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Test head
        working-directory: head
        run: go test ./table/dv -run 'TestKeepMaskForRange' -count=1
      - name: Benchmark base
        run: |
          cp head/table/dv/roaring_bitmap_density_bench_test.go base/table/dv/
          cd base
          go test ./table/dv -run '^$' -bench '^BenchmarkKeepMaskForRangeDensity$' -benchtime=300ms -count=5 -benchmem | tee "$GITHUB_WORKSPACE/base-bench.txt"
      - name: Benchmark head
        working-directory: head
        run: go test ./table/dv -run '^$' -bench '^BenchmarkKeepMaskForRangeDensity$' -benchtime=300ms -count=5 -benchmem | tee "$GITHUB_WORKSPACE/head-bench.txt"
      - name: Compare medians
        run: |
          python3 - <<'PY'
          import statistics
          def parse(path):
              results = {}
              for line in open(path):
                  fields = line.strip().split()
                  if fields and fields[0].startswith("BenchmarkKeepMaskForRangeDensity/") and len(fields) >= 8:
                      key = fields[0].rsplit('-', 1)[0].split('/', 1)[1]
                      results.setdefault(key, []).append((float(fields[2]), int(fields[4]), int(fields[6])))
              return results
          base, head = parse('base-bench.txt'), parse('head-bench.txt')
          print('BENCHMARK SUMMARY (median over five runs, same runner)')
          print('case | base ns/op | head ns/op | speedup | base B/op | head B/op | base allocs/op | head allocs/op')
          for case in sorted(base):
              before = [statistics.median(v[i] for v in base[case]) for i in range(3)]
              after = [statistics.median(v[i] for v in head[case]) for i in range(3)]
              print(f'{case} | {before[0]:.0f} | {after[0]:.0f} | {before[0] / after[0]:.2f}x | {before[1]:.0f} | {after[1]:.0f} | {before[2]:.0f} | {after[2]:.0f}')
          if not base or set(base) != set(head):
              raise SystemExit("missing benchmark cases")
          PY
