name: Temporary AddFiles benchmark
on:
  push:
    branches:
      - bench/addfiles-shared-parquet-plans-20261021
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Parity tests
        run: go test ./table -run '^TestAddFilesConversionPlan' -count=1
      - name: Benchmark
        run: go test ./table -run '^$' -bench '^BenchmarkAddFilesConversionPlans$' -benchmem -benchtime=3x -count=2 -timeout=10m
