name: Inspect manifest benchmark
on:
  push:
    branches:
      - bench/inspect-manifest-prefetch-20261021

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
      - name: Regression tests and 2x8 full benchmarks
        run: go test ./table -run '^TestInspectManifestPrefetch' -bench '^BenchmarkInspectFilesManifestPrefetch$' -benchtime=8x -count=2 -timeout=20m
