# Temporary benchmark workflow for the partition batch optimization.
name: Partition batch benchmark
on:
  push:
    branches:
      - bench/inspect-partitions-action-20261029
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
      - name: Run partition batch benchmark
        run: go test ./table -run '^$' -bench '^BenchmarkInspectPartitionBatchEncoding$' -benchtime=200ms -count=3 -benchmem -timeout=25m
