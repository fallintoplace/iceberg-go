name: Partition gather benchmark

on:
  push:
    branches:
      - bench/partition-gather-prototype

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Run partition gather benchmark
        run: >-
          go test ./table
          -run '^$'
          -bench '^BenchmarkPartitionGatherPrototype$'
          -benchmem
          -benchtime=200ms
          -count=5
