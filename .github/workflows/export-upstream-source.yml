name: Export benchmark dependencies

on:
  push:
    branches:
      - tmp/export-upstream-main-20261007

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream main
        uses: actions/checkout@v4
        with:
          repository: apache/iceberg-go
          ref: main
          fetch-depth: 0
          path: source

      - name: Install Go 1.26.3
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false

      - name: Warm table dependencies
        working-directory: source
        run: go test ./table -run '^$'

      - name: Package module cache
        shell: bash
        run: |
          modcache="$(go env GOMODCACHE)"
          tar -C "$(dirname "$modcache")" -czf /tmp/gomodcache-go1.26.3.tar.gz "$(basename "$modcache")"

      - name: Upload module cache
        uses: actions/upload-artifact@v4
        with:
          name: gomodcache-go1.26.3
          path: /tmp/gomodcache-go1.26.3.tar.gz
          retention-days: 1
