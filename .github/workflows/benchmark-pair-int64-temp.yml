name: Temporary equality delete benchmark
on:
  push:
    branches:
      - bench/equality-pair-int64-20261021

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        run: |
          gofmt -d table/equality_delete_reader.go table/equality_delete_pair_int64_test.go
      - name: Run pair tests
        run: |
          go test ./table -run '^(TestProcessEqualityDeletesPairInt64MatchesGeneric|TestPairInt64IndexRejectsInvalidKeys|TestPairInt64IndexSkipsNestedAndNonInt64Fields|TestPairInt64IndexConcurrentBuild)$' -count=1 -v
      - name: Run baseline benchmark
        run: |
          git worktree add --detach /tmp/iceberg-bench-base 407a4cdc8fd73352364d2ebf0af0f597f24ff9d5
          cd /tmp/iceberg-bench-base
          go test ./table -run '^$' -bench '^BenchmarkProcessEqualityDeletesInt$' -benchtime=200ms -count=5 -benchmem > /tmp/baseline.txt
          cat /tmp/baseline.txt
      - name: Run candidate benchmark
        run: |
          go test ./table -run '^$' -bench '^BenchmarkProcessEqualityDeletesInt$' -benchtime=200ms -count=5 -benchmem > /tmp/candidate.txt
          cat /tmp/candidate.txt
      - name: Summarize raw benchmark results
        if: always()
        run: |
          cat /tmp/baseline.txt 2>/dev/null || true
          cat /tmp/candidate.txt 2>/dev/null || true
